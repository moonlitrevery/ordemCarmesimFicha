<h1>Trocchia — disposição v1 (rascunho pra você corrigir)</h1>
<p>Esquemático, não é o mapa final. Norte pra cima. ~300 m × 220 m. Corrija à vontade: arraste mentalmente, risque por cima, ou me diga "a capela vai pra lá".</p>
<svg viewBox="0 0 900 660" width="900" height="660">

 <path d="M150 560 C 250 600, 650 610, 760 560 L 900 660 L 0 660 Z" fill="#5d6b34" opacity=".85"/>
 <text x="380" y="640" fill="#d9e3b0" font-size="13">vinhas e muros de pedra seca · estrada desce pro litoral (SO) · Vesúvio ao sudeste</text>
 <text x="30" y="40" fill="#9fb98a" font-size="13">MATA (castanheiro, carvalho)</text>
 <!-- área urbana -->
 <ellipse cx="450" cy="330" rx="300" ry="215" fill="#3a3a32"/>

 <path d="M120 660 C 220 560, 330 520, 400 430 S 440 330, 450 300 S 470 180, 480 120" fill="none" stroke="#8a8170" stroke-width="16" stroke-linecap="round"/>

 <rect x="410" y="270" width="95" height="70" fill="#9b9385" stroke="#c9c0ad"/>
 <circle cx="457" cy="305" r="7" fill="#5f8fa0"/>
 <text x="414" y="262" fill="#fff" font-size="13" font-weight="700">PRAÇA + fonte</text>
 <!-- marcadores -->
 <g font-size="12" fill="#fff">
  <rect x="380" y="338" width="34" height="26" fill="#a0522d"/><text x="300" y="372">Pousada da Rosa (esquina SO)</text>
  <rect x="508" y="282" width="30" height="22" fill="#2f4a8a"/><text x="545" y="296">Carabinieri (leste da praça)</text>

 <text x="40" y="560" fill="#e8d4a8" font-size="12">← para Nápoles: posto e pronto-socorro na estrada</text>
