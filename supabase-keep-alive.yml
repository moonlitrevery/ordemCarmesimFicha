name: Supabase Keep-Alive

on:
  schedule:
    - cron: '37 9 * * *'   # todo dia às 09:37 UTC — minuto quebrado de propósito, evita hora cheia
  workflow_dispatch:        # deixa rodar manualmente pelo botão, útil pra testar agora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
