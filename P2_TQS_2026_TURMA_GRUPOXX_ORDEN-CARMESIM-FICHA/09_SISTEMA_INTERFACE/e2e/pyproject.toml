[project]
name = "ordem-carmesim-e2e"
version = "0.1.0"
description = "Testes E2E (Playwright) do Ordem Carmesim"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--screenshot only-on-failure --tracing retain-on-failure"

[tool.uv]
package = false
