# Pousada da Rosa — térreo. Coordenadas em METROS. Origem no canto superior esquerdo, x → leste, y → sul.
# Disposição aprovada é esta; ajuste fino de posição (evitar sobreposição, alinhar) é permitido.
id: pousada-rosa-terreo
title: Pousada da Rosa — térreo
visibility: mestra
size_m: [16, 19]
px_per_m: 120          # saída ~1920×2280
sun: { azimuth_deg: 135, elevation_deg: 40 }   # luz vindo do sudeste, sombras pra noroeste

ground:
  - { rect: [0, 0, 16, 19], material: grass_short }
  - { rect: [0, 16.2, 16, 19], material: cobblestone_basalt }      # calçada da praça
  - { rect: [1, 0.5, 15, 5], material: garden_soil }               # jardim dos fundos

buildings:
  - id: pousada
    footprint: [[1, 5], [15, 5], [15, 16.2], [1, 16.2]]
    wall: { thickness: 0.35, material: plaster_tufo_old }
    roof: { show: false }   # interior visível neste mapa
    rooms:
      - { name: salao,    rect: [1, 9.5, 15, 16.2], floor: terracotta_tiles_worn }
      - { name: escada,   rect: [1, 5, 4, 9.5],     floor: wood_planks_dark }
      - { name: cozinha,  rect: [4, 5, 12.5, 9.5],  floor: ceramic_tiles_checker_cream }
      - { name: despensa, rect: [12.5, 5, 15, 9.5], floor: concrete_old }
    doors:
      - { between: [salao, outside], wall: south, at_x: 7.6, width: 1.2, type: wood_glass_double }
      - { between: [salao, cozinha], wall_y: 9.5, at_x: 8.2, width: 0.9, type: swing }
      - { between: [salao, escada],  wall_y: 9.5, at_x: 2.5, width: 0.9, type: open }
      - { between: [cozinha, despensa], wall_x: 12.5, at_y: 7.5, width: 0.8, type: wood }
      - { between: [cozinha, outside], wall: north, at_x: 6, width: 0.9, type: wood }
    windows:
      - { wall: south, at_x: 3.2, width: 1.4 }
      - { wall: south, at_x: 12.2, width: 1.4 }
      - { wall: east,  at_y: 13, width: 1.2 }
      - { wall: north, at_x: 10, width: 1.0 }

